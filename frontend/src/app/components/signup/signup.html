<div class="auth-container">
  <!-- Left Dark Banner Section -->
  <div class="auth-banner">
    <div class="banner-header">
      <p class="tagline">Smart inventory tracking & order management for modern retail.</p>
    </div>

    <div class="banner-hero">
      <h1>Manage<br />your inventory</h1>
      <div class="metrics-card">
        <span class="label">Total Stock Value</span>
        <span class="value">$128,450.00</span>
      </div>
    </div>

    <div class="banner-footer">
      <span>© 2026 RetailInventory Inc.</span>
    </div>
  </div>

  <!-- Right Form Card Section -->
  <div class="auth-card-container">
    <div class="auth-card">
      <div class="card-header">
        <div class="brand">
          <span class="logo-icon">🔴</span>
          <span class="brand-name">zinklit</span>
        </div>
        <button class="toggle-btn" (click)="toggleMode()">
          {{ isLoginMode ? 'Sign Up' : 'Sign In' }}
        </button>
      </div>

      <div class="card-body">
        <h2>{{ isLoginMode ? 'Sign In' : 'Create Account' }}</h2>

        <div *ngIf="errorMessage" class="error-alert">
          {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label>Username</label>
            <input
              type="text"
              name="username"
              [(ngModel)]="username"
              placeholder="Enter username"
              required
            />
          </div>

          <div *ngIf="!isLoginMode" class="form-group">
            <label>Email Address</label>
            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="Enter email"
              required
            />
          </div>

          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              name="password"
              [(ngModel)]="password"
              placeholder="••••••••"
              required
            />
          </div>

          <div *ngIf="isLoginMode" class="form-actions-link">
            <a href="javascript:void(0)" class="forgot-pwd">Forgot password?</a>
          </div>

          <button type="submit" class="submit-btn" [disabled]="isLoading">
            {{ isLoading ? 'Processing...' : isLoginMode ? 'Sign In →' : 'Sign Up →' }}
          </button>
        </form>
      </div>

      <div class="card-footer">
        <a href="javascript:void(0)">Contact Us</a>
        <span>English ∨</span>
      </div>
    </div>
  </div>
</div>
